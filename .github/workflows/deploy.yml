name: Build Check

# 這個 workflow 只驗證「網站程式可從乾淨 checkout 建置成功」。
# 公開網站由 DSH 在本機匯出世界模型資料、建置後直接提交到 main，
# GitHub Pages（分支來源 main / root）即會發布。
# 這裡不得連線 FNS／Obsidian，也不使用任何 FNS 憑證。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify static data was bundled
        run: |
          test -f index.html
          test -f model-data/meta.json
          test -d assets
